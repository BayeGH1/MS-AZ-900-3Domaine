<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AZ-900 Study Kit – Flashcards &amp; Practice Exam</title>
  <meta name="description" content="Study all three domains of the Microsoft AZ-900 Azure Fundamentals exam with flashcards, practice questions and a weighted mock exam.">
  <style>
:root {
  --bg: #f5f7fa; --panel: #ffffff; --text: #1b1f24; --muted: #5b6672;
  --line: #d9dee5; --accent: #0f6cbd; --accent-fg: #ffffff;
  --good: #1b7f3b; --good-bg: #e3f4e8; --bad: #b3261e; --bad-bg: #fbe7e5;
  --warn: #8a5a00; --warn-bg: #fff3d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161b; --panel: #1b2128; --text: #e8ecf1; --muted: #9aa6b3;
    --line: #2f3944; --accent: #4aa3f0; --accent-fg: #0b1117;
    --good: #5ccf80; --good-bg: #17301f; --bad: #ff8b84; --bad-bg: #3a1c1a;
    --warn: #f0c060; --warn-bg: #3a2f14;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
.top { background: var(--panel); border-bottom: 1px solid var(--line); padding: 16px 0 0; }
.top h1 { margin: 0; font-size: 1.4rem; }
.sub { margin: 2px 0 12px; color: var(--muted); }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: none; color: var(--muted); padding: 10px 16px; font: inherit; cursor: pointer; border-bottom: 3px solid transparent; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
main { padding-top: 20px; padding-bottom: 20px; }
.view[hidden] { display: none; }
.foot { color: var(--muted); font-size: .85rem; padding-bottom: 32px; }
a { color: var(--accent); }

.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
.toolbar label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: .9rem; }
select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.meta { color: var(--muted); margin: 0 0 12px; font-size: .9rem; }

.btn { font: inherit; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .card:focus-visible, .tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn.good { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.btn.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.btn.ghost { background: none; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; justify-content: center; }

/* Flashcard */
.card { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; perspective: 1200px; text-align: left; font: inherit; color: inherit; }
.card-inner { display: grid; transition: transform .45s; transform-style: preserve-3d; }
.card.flipped .card-inner { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; min-height: 260px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; display: flex; flex-direction: column; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face.back { transform: rotateY(180deg); border-color: var(--accent); }
.face .label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.face .text { font-size: 1.2rem; }
.face .tag { align-self: flex-start; margin-top: 18px; }
.tag { display: inline-block; font-size: .75rem; padding: 2px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
.tag.done { background: var(--good-bg); color: var(--good); }
.hint-small { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 10px; }

/* Exam */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
.panel h2 { margin-top: 0; }
.exam-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; }
.timer.low { color: var(--bad); }
.qtext { font-size: 1.15rem; margin: 8px 0; }
.hint { color: var(--muted); margin: 0 0 12px; font-size: .9rem; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--bg); }
.opt:hover { border-color: var(--accent); }
.opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); }
.opt input { margin-top: 4px; }
.confirm { margin-top: 16px; padding: 14px 16px; border: 1px solid var(--warn); background: var(--warn-bg); color: var(--text); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.confirm p { margin: 0 12px 0 0; flex: 1 1 100%; }
.palette { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
.pal { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; cursor: pointer; position: relative; }
.pal.answered { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.pal.current { outline: 3px solid var(--text); outline-offset: 1px; }
.pal.flag::after { content: "⚑"; position: absolute; top: -8px; right: -4px; font-size: .8rem; color: var(--warn); }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.row .spacer { flex: 1; }

.score { font-size: 2.4rem; font-weight: 700; margin: 4px 0; }
.score.pass { color: var(--good); }
.score.fail { color: var(--bad); }
table { width: 100%; border-collapse: collapse; margin: 12px 0 20px; font-size: .95rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; min-width: 80px; }
.bar > span { display: block; height: 100%; background: var(--accent); }

.review { margin-top: 16px; display: grid; gap: 14px; }
.rev { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: var(--panel); }
.rev.ok { border-left: 5px solid var(--good); }
.rev.ko { border-left: 5px solid var(--bad); }
.rev h3 { font-size: 1rem; margin: 0 0 8px; }
.rev ul { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 4px; }
.rev li { padding: 6px 10px; border-radius: 8px; }
.rev li.correct { background: var(--good-bg); color: var(--good); }
.rev li.wrong { background: var(--bad-bg); color: var(--bad); }
.rev .why { color: var(--muted); font-size: .92rem; margin: 6px 0 0; }

@media (prefers-reduced-motion: reduce) { .card-inner { transition: none; } }
@media (max-width: 520px) { .face { padding: 20px; min-height: 230px; } .face .text { font-size: 1.05rem; } }

</style>

  <script>
// Domain 1: Describe cloud concepts
window.FLASHCARDS = (window.FLASHCARDS || []).concat([
  // ---------- Cloud computing concepts ----------
  { domain: "D1", topic: "Cloud concepts", q: "What is cloud computing?",
    a: "Delivery of computing services (servers, storage, databases, networking, software, analytics) over the internet, usually with pay-as-you-go pricing." },
  { domain: "D1", topic: "Cloud concepts", q: "What is the shared responsibility model?",
    a: "Security and operational duties are split between the cloud provider and the customer. The split depends on the service type: the more the provider manages (IaaS < PaaS < SaaS), the fewer duties remain with you." },
  { domain: "D1", topic: "Cloud concepts", q: "What is ALWAYS the customer's responsibility, whatever the service type?",
    a: "Information and data, devices (mobile and PCs), and accounts and identities." },
  { domain: "D1", topic: "Cloud concepts", q: "What is ALWAYS the cloud provider's responsibility?",
    a: "The physical datacenter, the physical network and the physical hosts." },
  { domain: "D1", topic: "Cloud concepts", q: "Which responsibilities change depending on IaaS, PaaS or SaaS?",
    a: "Operating system, network controls, applications, and identity/directory infrastructure. Customer owns the most in IaaS, shares in PaaS, and the least in SaaS." },
  { domain: "D1", topic: "Cloud concepts", q: "What is a public cloud?",
    a: "Cloud services owned and operated by a provider (such as Azure) and delivered over the internet. Hardware is shared among customers, there is no hardware to buy, and you pay for what you use." },
  { domain: "D1", topic: "Cloud concepts", q: "What is a private cloud?",
    a: "Cloud resources used exclusively by a single organization, hosted on-premises or by a third party. Offers more control but you pay for and maintain the infrastructure (capital expense)." },
  { domain: "D1", topic: "Cloud concepts", q: "What is a hybrid cloud?",
    a: "A mix of public and private (on-premises) environments that work together. Useful to keep sensitive or legacy workloads local while using the public cloud for scale and flexibility." },
  { domain: "D1", topic: "Cloud concepts", q: "What is multi-cloud?",
    a: "Using cloud services from more than one cloud provider (for example Azure and another provider) to avoid dependence on a single vendor or to choose the best service for each need." },
  { domain: "D1", topic: "Cloud concepts", q: "What is capital expenditure (CapEx)?",
    a: "Up-front spending on physical infrastructure (servers, datacenters) whose value is deducted over time. Typical of on-premises and private cloud." },
  { domain: "D1", topic: "Cloud concepts", q: "What is operational expenditure (OpEx)?",
    a: "Spending on services or products as you use them, billed in the current period, with no up-front cost. Typical of public cloud." },
  { domain: "D1", topic: "Cloud concepts", q: "What is the consumption-based model?",
    a: "You pay only for the resources you use. There are no up-front costs, no need to buy infrastructure for peak load, and you can stop paying when you stop using the service." },

  // ---------- Cloud benefits ----------
  { domain: "D1", topic: "Cloud benefits", q: "What is high availability?",
    a: "Keeping a service up and running with minimal downtime, typically expressed through a service level agreement (SLA) such as 99.9% or 99.99%." },
  { domain: "D1", topic: "Cloud benefits", q: "What is scalability?",
    a: "The ability to adjust resources to meet demand. It can be vertical (bigger machine) or horizontal (more machines)." },
  { domain: "D1", topic: "Cloud benefits", q: "What is vertical scaling?",
    a: "Scale up/down: add or remove CPU, memory or storage on an existing resource, such as resizing a VM." },
  { domain: "D1", topic: "Cloud benefits", q: "What is horizontal scaling?",
    a: "Scale out/in: add or remove instances of a resource, such as adding more web servers behind a load balancer." },
  { domain: "D1", topic: "Cloud benefits", q: "What is elasticity?",
    a: "Automatically adding or removing resources as demand changes so you do not over-provision or run out of capacity. Autoscale is the typical example." },
  { domain: "D1", topic: "Cloud benefits", q: "What is reliability in the cloud?",
    a: "The ability of a system to recover from failures and keep functioning, helped by a decentralized design, multiple regions and zones, and redundancy." },
  { domain: "D1", topic: "Cloud benefits", q: "What is predictability in the cloud?",
    a: "Performance predictability (autoscaling and load balancing keep workloads responsive) and cost predictability (you can forecast spend using tools such as the pricing calculator and Cost Management)." },
  { domain: "D1", topic: "Cloud benefits", q: "How does the cloud help with security?",
    a: "Providers offer built-in security tooling, physical datacenter protection, compliance certifications and threat detection. You choose the level of control (IaaS, PaaS, SaaS) and remain responsible for your data and identities." },
  { domain: "D1", topic: "Cloud benefits", q: "What is governance in the cloud?",
    a: "Rules and policies that keep resources consistent and compliant (for example with Azure Policy), plus auditing and templates for standardized deployments." },
  { domain: "D1", topic: "Cloud benefits", q: "What does manageability mean in the cloud?",
    a: "Management OF the cloud (autoscaling, deployment templates, monitoring and alerts) and management IN the cloud (portal, CLI, PowerShell, APIs to run your resources)." },
  { domain: "D1", topic: "Cloud benefits", q: "What are economies of scale?",
    a: "Large providers buy and run infrastructure at huge volume, so the cost per unit is lower and savings are passed on to customers." },
  { domain: "D1", topic: "Cloud benefits", q: "How does the cloud help with disaster recovery?",
    a: "Data and workloads can be replicated to other regions or zones and recovered quickly, without building a second physical datacenter." },
  { domain: "D1", topic: "Cloud benefits", q: "What is a global reach benefit of the cloud?",
    a: "You can deploy near your users in many regions worldwide, which lowers latency and helps meet data residency needs." },

  // ---------- Service types ----------
  { domain: "D1", topic: "Cloud service types", q: "What is Infrastructure as a Service (IaaS)?",
    a: "The provider supplies virtualized compute, storage and networking. You manage the OS, middleware, apps and data. Example: Azure Virtual Machines." },
  { domain: "D1", topic: "Cloud service types", q: "What is Platform as a Service (PaaS)?",
    a: "The provider manages the infrastructure, OS and runtime, so you focus on applications and data. Examples: Azure App Service, Azure SQL Database." },
  { domain: "D1", topic: "Cloud service types", q: "What is Software as a Service (SaaS)?",
    a: "Ready-to-use software delivered over the internet. The provider manages everything; you manage your data, users and configuration. Examples: Microsoft 365, Dynamics 365." },
  { domain: "D1", topic: "Cloud service types", q: "What is serverless computing?",
    a: "You write code or define logic and the platform runs it on demand, scales automatically and bills per execution, with no server management. Example: Azure Functions." },
  { domain: "D1", topic: "Cloud service types", q: "Which service type gives you the most control and the most responsibility?",
    a: "IaaS (outside of on-premises). You manage the OS, patches, runtime, apps and data." },
  { domain: "D1", topic: "Cloud service types", q: "When is IaaS the best fit?",
    a: "Lift-and-shift migrations, custom or legacy applications that need OS-level control, and test/dev environments you can create and delete quickly." },
  { domain: "D1", topic: "Cloud service types", q: "When is PaaS the best fit?",
    a: "When developers want to build, test and deploy applications without managing servers, OS patching or runtime updates." },
  { domain: "D1", topic: "Cloud service types", q: "When is SaaS the best fit?",
    a: "When you need ready-made software such as email, collaboration or CRM, with no development and minimal administration." },
  { domain: "D1", topic: "Cloud service types", q: "Who patches the operating system in IaaS vs PaaS?",
    a: "IaaS: the customer patches the OS. PaaS: the provider patches the OS and runtime." },
  { domain: "D1", topic: "Cloud service types", q: "Order IaaS, PaaS and SaaS from most customer control to least.",
    a: "IaaS (most), then PaaS, then SaaS (least)." }
]);

</script>
  <script>
// AZ-900 Domain 2: Describe Azure architecture and services
// Each card: { topic, q, a }
window.FLASHCARDS = (window.FLASHCARDS || []).concat([
  // ---------- Core architectural components ----------
  { domain: "D2", topic: "Core architecture", q: "What is an Azure region?",
    a: "A geographical area containing one or more datacenters that are networked together with a dedicated, low-latency network." },
  { domain: "D2", topic: "Core architecture", q: "What is an Azure geography?",
    a: "A discrete market, typically containing two or more regions, that preserves data residency and compliance boundaries." },
  { domain: "D2", topic: "Core architecture", q: "What is an Availability Zone?",
    a: "A physically separate location inside a region. Each zone has one or more datacenters with independent power, cooling and networking. Regions that support zones have at least three of them." },
  { domain: "D2", topic: "Core architecture", q: "What is a region pair?",
    a: "Each region is paired with another region in the same geography (usually at least 300 miles apart). Platform updates roll out to paired regions sequentially, and during a broad outage one region of each pair is prioritized for recovery." },
  { domain: "D2", topic: "Core architecture", q: "What are sovereign regions?",
    a: "Isolated instances of Azure for legal or compliance needs, for example Azure Government (US government) and Azure China operated by 21Vianet." },
  { domain: "D2", topic: "Core architecture", q: "What is an availability set?",
    a: "A logical grouping of VMs inside one datacenter, spread over fault domains and update domains so one hardware failure or maintenance event does not take down every VM. SLA: 99.95%." },
  { domain: "D2", topic: "Core architecture", q: "Which VM SLA can you reach with Availability Zones?",
    a: "99.99% when VMs are deployed across two or more zones (99.95% with an availability set, 99.9% for a single VM using premium SSD or ultra disks)." },
  { domain: "D2", topic: "Core architecture", q: "What is an Azure resource?",
    a: "A manageable item available through Azure, such as a virtual machine, storage account, web app, database or virtual network." },
  { domain: "D2", topic: "Core architecture", q: "What is a resource group?",
    a: "A logical container for resources deployed in a subscription. A resource belongs to exactly one resource group, and deleting the group deletes every resource inside it." },
  { domain: "D2", topic: "Core architecture", q: "What is an Azure subscription?",
    a: "A unit of management, billing and scale. It provides authenticated and authorized access to Azure products and services, and it is a billing boundary." },
  { domain: "D2", topic: "Core architecture", q: "What is the Azure management hierarchy, top to bottom?",
    a: "Management groups, then subscriptions, then resource groups, then resources." },
  { domain: "D2", topic: "Core architecture", q: "What are management groups used for?",
    a: "Organizing subscriptions and applying governance (Azure Policy, RBAC) across many of them. Settings are inherited by everything below. Up to six levels of depth, not counting the root or subscription level." },
  { domain: "D2", topic: "Core architecture", q: "What is Azure Resource Manager (ARM)?",
    a: "The deployment and management service for Azure. Every request (portal, CLI, PowerShell, REST API, SDKs) goes through it. It supports declarative infrastructure as code with ARM templates and Bicep." },

  // ---------- Compute and networking ----------
  { domain: "D2", topic: "Compute & networking", q: "When do you choose an Azure virtual machine?",
    a: "When you need full control of the OS and software (IaaS): lift-and-shift migrations, custom software, or workloads that need specific OS configuration. You patch and manage the OS." },
  { domain: "D2", topic: "Compute & networking", q: "What are Virtual Machine Scale Sets?",
    a: "A service to create and manage a group of identical, load-balanced VMs that can automatically scale out and in based on demand or a schedule." },
  { domain: "D2", topic: "Compute & networking", q: "What is Azure Virtual Desktop?",
    a: "A desktop and app virtualization service running in the cloud. It supports Windows 10/11 multi-session and provides secure remote access from any device." },
  { domain: "D2", topic: "Compute & networking", q: "What is Azure Container Instances (ACI)?",
    a: "The fastest, simplest way to run a container in Azure without managing VMs or an orchestrator. Billed per second." },
  { domain: "D2", topic: "Compute & networking", q: "What is Azure Kubernetes Service (AKS)?",
    a: "A managed Kubernetes service for deploying, scaling and managing containerized applications. Azure handles the control plane." },
  { domain: "D2", topic: "Compute & networking", q: "What is Azure Container Apps?",
    a: "A serverless container platform for microservices and APIs. It is built on Kubernetes but hides the cluster management." },
  { domain: "D2", topic: "Compute & networking", q: "What is Azure App Service?",
    a: "A PaaS offering for hosting web apps, REST APIs and mobile backends in .NET, Java, Node.js, Python and PHP. No OS or server management, with built-in scaling." },
  { domain: "D2", topic: "Compute & networking", q: "What is Azure Functions?",
    a: "A serverless, event-driven compute service. You run small pieces of code triggered by events and, on the Consumption plan, pay only when the code runs." },
  { domain: "D2", topic: "Compute & networking", q: "What is an Azure Virtual Network (VNet)?",
    a: "A private network in Azure. Resources inside it, divided into subnets, can communicate with each other, the internet and on-premises networks." },
  { domain: "D2", topic: "Compute & networking", q: "What is VNet peering?",
    a: "Connects two virtual networks (same or different regions) so resources communicate over the Microsoft backbone with low latency, using private IP addresses." },
  { domain: "D2", topic: "Compute & networking", q: "What is Azure VPN Gateway?",
    a: "Sends encrypted traffic between a VNet and an on-premises location (site-to-site) or a single client (point-to-site) over the public internet." },
  { domain: "D2", topic: "Compute & networking", q: "What is Azure ExpressRoute?",
    a: "A private, dedicated connection from on-premises to Azure through a connectivity provider. It does not travel over the public internet, so it offers higher reliability, speed and consistent latency." },
  { domain: "D2", topic: "Compute & networking", q: "VPN Gateway vs ExpressRoute: what is the key difference?",
    a: "VPN Gateway = encrypted tunnel over the public internet. ExpressRoute = private connection that bypasses the internet." },
  { domain: "D2", topic: "Compute & networking", q: "What is Azure DNS?",
    a: "A hosting service for DNS domains that uses Microsoft Azure infrastructure to resolve names. You manage records with the same credentials and tools as other Azure resources." },
  { domain: "D2", topic: "Compute & networking", q: "What is a public endpoint?",
    a: "A service endpoint with a public IP address reachable over the internet, such as the default endpoint of a storage account." },
  { domain: "D2", topic: "Compute & networking", q: "What is a private endpoint?",
    a: "A network interface with a private IP address from your VNet that connects you privately to an Azure service (powered by Azure Private Link). Traffic stays on the Microsoft backbone." },

  // ---------- Storage ----------
  { domain: "D2", topic: "Storage", q: "What is an Azure storage account?",
    a: "A container that groups Azure Storage services (Blobs, Files, Queues, Tables) under a unique namespace reachable over HTTP/HTTPS." },
  { domain: "D2", topic: "Storage", q: "What is Azure Blob Storage?",
    a: "Object storage for massive amounts of unstructured data such as images, video, documents, backups and logs." },
  { domain: "D2", topic: "Storage", q: "What is Azure Files?",
    a: "Fully managed cloud file shares accessible via SMB and NFS, mountable concurrently from cloud and on-premises machines." },
  { domain: "D2", topic: "Storage", q: "What is Azure Queue Storage?",
    a: "A messaging store for asynchronous communication between application components, holding large numbers of messages." },
  { domain: "D2", topic: "Storage", q: "What is Azure Table Storage?",
    a: "A NoSQL key/attribute store for structured, non-relational data." },
  { domain: "D2", topic: "Storage", q: "What is Azure Disk Storage?",
    a: "Block-level storage volumes (managed disks) used by Azure VMs, similar to physical disks in an on-premises server." },
  { domain: "D2", topic: "Storage", q: "What is Locally Redundant Storage (LRS)?",
    a: "Three synchronous copies of your data within a single datacenter in the primary region. The cheapest option, but it does not protect against a datacenter-wide failure." },
  { domain: "D2", topic: "Storage", q: "What is Zone-Redundant Storage (ZRS)?",
    a: "Synchronous copies across three Availability Zones in the primary region. Protects against a datacenter (zone) failure." },
  { domain: "D2", topic: "Storage", q: "What is Geo-Redundant Storage (GRS)?",
    a: "LRS in the primary region plus an asynchronous copy to a secondary (paired) region, where it is stored with LRS. Protects against a regional outage." },
  { domain: "D2", topic: "Storage", q: "What is Geo-Zone-Redundant Storage (GZRS)?",
    a: "ZRS in the primary region plus an asynchronous copy to a secondary region (stored with LRS). Combines zone and regional protection." },
  { domain: "D2", topic: "Storage", q: "What does the RA prefix mean in RA-GRS and RA-GZRS?",
    a: "Read-access: the data in the secondary region can be read at any time, not only after a failover." },
  { domain: "D2", topic: "Storage", q: "Describe the blob access tiers.",
    a: "Hot: frequent access, highest storage cost. Cool: infrequent access, kept at least 30 days. Cold: rare access, at least 90 days. Archive: offline, at least 180 days, lowest storage cost, hours to rehydrate." },

</script>
  <script>
(() => {
  'use strict';

  const CARDS = window.FLASHCARDS || [];
  const QUESTIONS = window.QUESTIONS || [];
  const DOMAINS = {
    D1: { short: 'Cloud concepts', weight: '25–30%' },
    D2: { short: 'Azure architecture & services', weight: '35–40%' },
    D3: { short: 'Management & governance', weight: '30–35%' }
  };
  const PASS_PCT = 70;                         // AZ-900 passing score is 700/1000
  const SECONDS_PER_Q = 90;                    // custom practice timer
  const MOCK_PLAN = { D1: 11, D2: 15, D3: 14 };  // 40 questions weighted like the real exam
  const MOCK_SECONDS = 45 * 60;

  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = arr => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('az900:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('az900:' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } }
  };

  const dName = d => `Domain ${d.slice(1)} · ${DOMAINS[d].short}`;
  const topicsFor = domain => [...new Set([...CARDS, ...QUESTIONS]
    .filter(x => domain === 'all' || x.domain === domain).map(x => x.topic))];
  const domainOptions = sel =>
    `<option value="all">All domains</option>` +
    Object.keys(DOMAINS).map(d => `<option value="${d}" ${d === sel ? 'selected' : ''}>${esc(dName(d))} (${DOMAINS[d].weight})</option>`).join('');
  const topicOptions = (domain, sel) =>
    `<option value="all">All topics</option>` +
    topicsFor(domain).map(t => `<option value="${esc(t)}" ${t === sel ? 'selected' : ''}>${esc(t)}</option>`).join('');
  const validDomain = d => d === 'all' || d in DOMAINS;

  /* ------------------------------------------------------------------ */
  /* Tabs                                                               */
  /* ------------------------------------------------------------------ */
  let currentView = 'flash';
  $$('.tab').forEach(btn => btn.addEventListener('click', () => {
    currentView = btn.dataset.view;
    $$('.tab').forEach(b => {
      const on = b === btn;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', String(on));
    });
    $('#view-flash').hidden = currentView !== 'flash';
    $('#view-exam').hidden = currentView !== 'exam';
  }));

  /* ------------------------------------------------------------------ */
  /* Flashcards                                                         */
  /* ------------------------------------------------------------------ */
  const flash = {
    domain: store.get('flashDomain', 'all'),
    topic: store.get('flashTopic', 'all'),
    hideKnown: store.get('hideKnown', false),
    known: new Set(store.get('known', [])),
    deck: [], i: 0, flipped: false, confirmReset: false
  };
  if (!validDomain(flash.domain)) flash.domain = 'all';
  if (flash.topic !== 'all' && !topicsFor(flash.domain).includes(flash.topic)) flash.topic = 'all';

  function buildDeck(doShuffle) {
    const d = CARDS.filter(c =>
      (flash.domain === 'all' || c.domain === flash.domain) &&
      (flash.topic === 'all' || c.topic === flash.topic) &&
      !(flash.hideKnown && flash.known.has(c.q)));
    flash.deck = doShuffle ? shuffle(d) : d;
    flash.i = 0;
    flash.flipped = false;
  }

  function renderFlash() {
    const el = $('#view-flash');
    const scope = CARDS.filter(c =>
      (flash.domain === 'all' || c.domain === flash.domain) &&
      (flash.topic === 'all' || c.topic === flash.topic));
    const mastered = scope.filter(c => flash.known.has(c.q)).length;
    const c = flash.deck[flash.i];

    let body;
    if (!c) {
      body = `<div class="panel"><h2>Nothing to show</h2>
        <p>${flash.hideKnown && scope.length ? 'You have mastered every card in this selection. Nice work!' : 'No cards for this selection.'}</p>
        ${flash.hideKnown ? '<button class="btn" data-act="show-all">Show mastered cards too</button>' : ''}</div>`;
    } else {
      const done = flash.known.has(c.q);
      body = `
        <button class="card ${flash.flipped ? 'flipped' : ''}" data-act="flip"
                aria-label="Flashcard. Press to flip." aria-pressed="${flash.flipped}">
          <span class="card-inner">
            <span class="face front" aria-hidden="${flash.flipped}">
              <span class="label">Question · ${flash.i + 1} / ${flash.deck.length}</span>
              <span class="text">${esc(c.q)}</span>
              <span class="tag ${done ? 'done' : ''}">D${c.domain.slice(1)} · ${esc(c.topic)}${done ? ' · mastered' : ''}</span>
            </span>
            <span class="face back" aria-hidden="${!flash.flipped}">
              <span class="label">Answer</span>
              <span class="text">${esc(c.a)}</span>
            </span>
          </span>
        </button>
        <p class="hint-small">Click the card or press Space to flip · ← → to navigate</p>
        <div class="actions">
          <button class="btn" data-act="prev">← Previous</button>
          <button class="btn bad" data-act="learning">Still learning</button>
          <button class="btn good" data-act="known">Got it ✓</button>
          <button class="btn" data-act="next">Next →</button>
        </div>`;
    }

    el.innerHTML = `
      <div class="toolbar">
        <label>Domain <select id="f-domain">${domainOptions(flash.domain)}</select></label>
        <label>Topic <select id="f-topic">${topicOptions(flash.domain, flash.topic)}</select></label>
        <label><input type="checkbox" id="f-hide" ${flash.hideKnown ? 'checked' : ''}> Hide mastered</label>
        <button class="btn ghost" data-act="shuffle">Shuffle</button>
        <button class="btn ${flash.confirmReset ? 'bad' : 'ghost'}" data-act="reset">${flash.confirmReset ? 'Click again to confirm reset' : 'Reset progress'}</button>
      </div>
      <p class="meta">Mastered ${mastered} of ${scope.length} cards in this selection · ${CARDS.length} cards in total</p>
      ${body}`;
  }

  function flashStep(delta) {
    if (!flash.deck.length) return;
    flash.i = (flash.i + delta + flash.deck.length) % flash.deck.length;
    flash.flipped = false;
    flash.confirmReset = false;
    renderFlash();
  }

  function flashMark(known) {
    const c = flash.deck[flash.i];
    if (!c) return;
    if (known) flash.known.add(c.q); else flash.known.delete(c.q);
    store.set('known', [...flash.known]);
    if (known && flash.hideKnown) {
      flash.deck.splice(flash.i, 1);
      if (flash.i >= flash.deck.length) flash.i = 0;
      flash.flipped = false;
      renderFlash();
    } else {
      flashStep(1);
    }
  }

  function flipCard() {
    const card = $('#view-flash .card');
    if (!card) return;
    flash.flipped = !flash.flipped;
    card.classList.toggle('flipped', flash.flipped);
    card.setAttribute('aria-pressed', String(flash.flipped));
    $('.face.front', card).setAttribute('aria-hidden', String(flash.flipped));
    $('.face.back', card).setAttribute('aria-hidden', String(!flash.flipped));
  }

  $('#view-flash').addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    switch (btn.dataset.act) {
      case 'flip': flipCard(); break;
      case 'prev': flashStep(-1); break;
      case 'next': flashStep(1); break;
      case 'known': flashMark(true); break;
      case 'learning': flashMark(false); break;
      case 'shuffle': flash.confirmReset = false; buildDeck(true); renderFlash(); break;
      case 'show-all':
        flash.hideKnown = false; store.set('hideKnown', false);
        buildDeck(false); renderFlash(); break;
      case 'reset':
        if (!flash.confirmReset) {
          flash.confirmReset = true; renderFlash();
        } else {
          flash.confirmReset = false;
          flash.known.clear(); store.set('known', []);
          buildDeck(false); renderFlash();
        }
        break;
    }
  });
  $('#view-flash').addEventListener('change', e => {
    if (e.target.id === 'f-domain') {
      flash.domain = e.target.value; flash.topic = 'all';
      store.set('flashDomain', flash.domain); store.set('flashTopic', 'all');
    } else if (e.target.id === 'f-topic') {
      flash.topic = e.target.value; store.set('flashTopic', flash.topic);
    } else if (e.target.id === 'f-hide') {
      flash.hideKnown = e.target.checked; store.set('hideKnown', flash.hideKnown);
    } else return;
    flash.confirmReset = false;
    buildDeck(false); renderFlash();
  });
  document.addEventListener('keydown', e => {
    if (currentView !== 'flash') return;
    const t = e.target;
    if (t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); flashStep(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); flashStep(-1); }
    else if (e.key === ' ' && !(t && t.tagName === 'BUTTON')) { e.preventDefault(); flipCard(); }
  });

  /* ------------------------------------------------------------------ */
  /* Practice exam                                                      */
  /* ------------------------------------------------------------------ */
  const exam = {
    phase: 'setup',       // setup | run | result
    qs: [], sel: [], flag: new Set(),
    i: 0, endAt: 0, timed: true, timer: null, confirming: false,
    results: [], onlyWrong: false, label: '',
    cfg: {
      mode: store.get('examMode', 'custom'),
      count: store.get('examCount', '20'),
      domain: store.get('examDomain', 'all'),
      topic: store.get('examTopic', 'all'),
      timed: store.get('examTimed', true)
    }
  };
  if (!validDomain(exam.cfg.domain)) exam.cfg.domain = 'all';
  if (exam.cfg.topic !== 'all' && !topicsFor(exam.cfg.domain).includes(exam.cfg.topic)) exam.cfg.topic = 'all';
  const examEl = $('#view-exam');
  const setEq = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

  function renderExam() {
    if (exam.phase === 'setup') renderSetup();
    else if (exam.phase === 'run') renderRun();
    else renderResult();
  }

  function renderSetup() {
    const best = store.get('best', null);
    const { mode } = exam.cfg;
    const counts = ['10', '20', '40', '60', '100', 'all'];
    const bank = Object.keys(DOMAINS).map(d =>
      `${DOMAINS[d].short}: ${QUESTIONS.filter(q => q.domain === d).length}`).join(' · ');
    const custom = `
      <div class="toolbar">
        <label>Domain <select id="e-domain">${domainOptions(exam.cfg.domain)}</select></label>
        <label>Topic <select id="e-topic">${topicOptions(exam.cfg.domain, exam.cfg.topic)}</select></label>
        <label>Questions
          <select id="e-count">${counts.map(c =>
            `<option value="${c}" ${c === exam.cfg.count ? 'selected' : ''}>${c === 'all' ? 'All' : c}</option>`).join('')}</select>
        </label>
        <label><input type="checkbox" id="e-timed" ${exam.cfg.timed ? 'checked' : ''}> Timed (${SECONDS_PER_Q / 60} min per question)</label>
      </div>`;
    const mock = `<p class="meta">40 questions: ${MOCK_PLAN.D1} from Domain 1, ${MOCK_PLAN.D2} from Domain 2 and ${MOCK_PLAN.D3} from Domain 3, drawn at random. Timed: ${MOCK_SECONDS / 60} minutes.</p>`;
    examEl.innerHTML = `
      <div class="panel">
        <h2>Practice exam</h2>
        <p>${QUESTIONS.length} questions in the bank (${bank}). Questions and answer options are shuffled every attempt.
           Pass mark: ${PASS_PCT}%. Some questions need several answers: read the instruction under the question.</p>
        <div class="toolbar">
          <label>Mode
            <select id="e-mode">
              <option value="custom" ${mode === 'custom' ? 'selected' : ''}>Custom practice</option>
              <option value="mock" ${mode === 'mock' ? 'selected' : ''}>Mock exam (weighted by domain)</option>
            </select>
          </label>
        </div>
        ${mode === 'mock' ? mock : custom}
        <button class="btn primary" data-act="start">Start exam</button>
        ${best ? `<p class="meta" style="margin-top:16px">Best score so far: ${best.pct}% (${best.correct}/${best.total}) on ${esc(best.date)}</p>` : ''}
      </div>`;
  }

  function pickQuestions() {
    const { mode, count, domain, topic } = exam.cfg;
    if (mode === 'mock') {
      return shuffle(Object.entries(MOCK_PLAN).flatMap(([d, n]) =>
        shuffle(QUESTIONS.filter(q => q.domain === d)).slice(0, n)));
    }
    const pool = shuffle(QUESTIONS.filter(q =>
      (domain === 'all' || q.domain === domain) && (topic === 'all' || q.topic === topic)));
    return count === 'all' ? pool : pool.slice(0, +count);
  }

  function startExam() {
    const pool = pickQuestions();
    if (!pool.length) return;
    const mock = exam.cfg.mode === 'mock';
    exam.qs = pool.map(q => ({ ...q, opts: shuffle(q.options.map((text, k) => ({ text, k }))) }));
    exam.sel = exam.qs.map(() => new Set());
    exam.flag = new Set();
    exam.i = 0;
    exam.confirming = false;
    exam.onlyWrong = false;
    exam.timed = mock || exam.cfg.timed;
    exam.label = mock ? 'Mock exam' : 'Practice';
    exam.phase = 'run';
    clearInterval(exam.timer);
    if (exam.timed) {
      const secs = mock ? MOCK_SECONDS : exam.qs.length * SECONDS_PER_Q;
      exam.endAt = Date.now() + secs * 1000;
      exam.timer = setInterval(tick, 1000);
    }
    renderExam();
  }

  function tick() {
    const left = Math.max(0, Math.round((exam.endAt - Date.now()) / 1000));
    const t = $('#timer');
    if (t) { t.textContent = `⏱ ${fmt(left)}`; t.classList.toggle('low', left <= 60); }
    if (left <= 0) finishExam();
  }

  function renderRun() {
    const q = exam.qs[exam.i];
    const multi = q.answer.length > 1;
    const sel = exam.sel[exam.i];
    const un = exam.sel.filter(s => !s.size).length;
    examEl.innerHTML = `
      <div class="panel">
        <div class="exam-head">
          <span class="tag">D${q.domain.slice(1)} · ${esc(q.topic)}</span>
          <span id="timer" class="timer">${exam.timed ? '' : 'Untimed'}</span>
        </div>
        <h2 class="qtext">Question ${exam.i + 1} of ${exam.qs.length}. ${esc(q.q)}</h2>
        <p class="hint">${multi ? `Choose ${q.answer.length} answers.` : 'Choose one answer.'}</p>
        <div class="opts" role="${multi ? 'group' : 'radiogroup'}">
          ${q.opts.map(o => `
            <label class="opt ${sel.has(o.k) ? 'on' : ''}">
              <input type="${multi ? 'checkbox' : 'radio'}" name="opt" value="${o.k}" ${sel.has(o.k) ? 'checked' : ''}>
              <span>${esc(o.text)}</span>
            </label>`).join('')}
        </div>
        ${exam.confirming ? `
          <div class="confirm" role="alertdialog" aria-label="Confirm submit">
            <p><strong>${un ? `You have ${un} unanswered question${un > 1 ? 's' : ''}.` : 'All questions answered.'}</strong>
               Submit your exam now?</p>
            <button class="btn primary" data-act="confirm-submit">Yes, submit</button>
            <button class="btn" data-act="cancel-submit">Keep working</button>
          </div>` : ''}
        <div class="row">
          <button class="btn" data-act="prev" ${exam.i === 0 ? 'disabled' : ''}>← Previous</button>
          <button class="btn" data-act="flag">${exam.flag.has(exam.i) ? 'Unflag' : 'Flag for review'} ⚑</button>
          <span class="spacer"></span>
          <button class="btn" data-act="next" ${exam.i === exam.qs.length - 1 ? 'disabled' : ''}>Next →</button>
          <button class="btn primary" data-act="submit">Submit exam</button>
        </div>
        <div class="palette" id="palette">${paletteHtml()}</div>
      </div>`;
    if (exam.timed) tick();
  }

  function paletteHtml() {
    return exam.qs.map((_, n) => `
      <button class="pal ${exam.sel[n].size ? 'answered' : ''} ${n === exam.i ? 'current' : ''} ${exam.flag.has(n) ? 'flag' : ''}"
              data-act="goto" data-n="${n}" aria-label="Go to question ${n + 1}">${n + 1}</button>`).join('');
  }

  function onSelect(input) {
    const q = exam.qs[exam.i];
    const k = +input.value;
    const sel = exam.sel[exam.i];
    if (q.answer.length > 1) {
      if (input.checked) sel.add(k); else sel.delete(k);
    } else {
      sel.clear(); sel.add(k);
    }
    $$('.opt', examEl).forEach(l => {
      const inp = $('input', l);
      l.classList.toggle('on', sel.has(+inp.value));
    });
    $('#palette').innerHTML = paletteHtml();
  }

  function finishExam() {
    exam.confirming = false;
    clearInterval(exam.timer);
    exam.results = exam.qs.map((q, i) => setEq(exam.sel[i], new Set(q.answer)));
    const correct = exam.results.filter(Boolean).length;
    const pct = Math.round((correct / exam.qs.length) * 100);
    const prev = store.get('best', null);
    if (!prev || pct > prev.pct) {
      store.set('best', { pct, correct, total: exam.qs.length, date: new Date().toLocaleDateString() });
    }
    exam.phase = 'result';
    renderExam();
    window.scrollTo({ top: 0 });
  }

  function breakdown(keyFn, labelFn) {
    const map = {};
    exam.qs.forEach((q, i) => {
      const k = keyFn(q);
      const t = map[k] || (map[k] = { ok: 0, n: 0 });
      t.n++; if (exam.results[i]) t.ok++;
    });
    return Object.keys(map).sort().map(k => {
      const v = map[k], p = Math.round((v.ok / v.n) * 100);
      return `<tr><td>${esc(labelFn(k))}</td><td>${v.ok}/${v.n}</td>
        <td><div class="bar"><span style="width:${p}%"></span></div></td><td>${p}%</td></tr>`;
    }).join('');
  }

  function renderResult() {
    const total = exam.qs.length;
    const correct = exam.results.filter(Boolean).length;
    const pct = Math.round((correct / total) * 100);
    const pass = pct >= PASS_PCT;

    const review = exam.qs.map((q, i) => ({ q, i }))
      .filter(({ i }) => !exam.onlyWrong || !exam.results[i])
      .map(({ q, i }) => `
        <article class="rev ${exam.results[i] ? 'ok' : 'ko'}">
          <h3>${i + 1}. ${esc(q.q)}</h3>
          <p class="why">D${q.domain.slice(1)} · ${esc(q.topic)}</p>
          <ul>${q.opts.map(o => {
            const isC = q.answer.includes(o.k), isS = exam.sel[i].has(o.k);
            const cls = isC ? 'correct' : isS ? 'wrong' : '';
            const mark = isC ? '✓ ' : isS ? '✗ ' : '';
            return `<li class="${cls}">${mark}${esc(o.text)}${isS ? ' <em>(your answer)</em>' : ''}</li>`;
          }).join('')}</ul>
          <p class="why">${esc(q.explain || '')}</p>
        </article>`).join('');

    examEl.innerHTML = `
      <div class="panel">
        <h2>${esc(exam.label)} results</h2>
        <div class="score ${pass ? 'pass' : 'fail'}">${pct}% · ${pass ? 'Pass' : 'Not yet'}</div>
        <p class="meta">${correct} of ${total} correct. Pass mark ${PASS_PCT}%.</p>
        <table><thead><tr><th>By domain</th><th>Score</th><th></th><th></th></tr></thead>
          <tbody>${breakdown(q => q.domain, dName)}</tbody></table>
        <table><thead><tr><th>By topic</th><th>Score</th><th></th><th></th></tr></thead>
          <tbody>${breakdown(q => q.topic, t => t)}</tbody></table>
        <div class="row">
          <button class="btn primary" data-act="again">New exam</button>
          <button class="btn" data-act="toggle-wrong">${exam.onlyWrong ? 'Show all questions' : 'Show only mistakes'}</button>
        </div>
      </div>
      <div class="review">${review || '<p class="meta">No mistakes. Perfect score!</p>'}</div>`;
  }

  examEl.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    switch (btn.dataset.act) {
      case 'start': startExam(); break;
      case 'prev': exam.confirming = false; exam.i = Math.max(0, exam.i - 1); renderExam(); break;
      case 'next': exam.confirming = false; exam.i = Math.min(exam.qs.length - 1, exam.i + 1); renderExam(); break;
      case 'goto': exam.confirming = false; exam.i = +btn.dataset.n; renderExam(); break;
      case 'flag':
        if (exam.flag.has(exam.i)) exam.flag.delete(exam.i); else exam.flag.add(exam.i);
        renderExam(); break;
      case 'submit': exam.confirming = true; renderExam(); break;
      case 'confirm-submit': finishExam(); break;
      case 'cancel-submit': exam.confirming = false; renderExam(); break;
      case 'again': exam.phase = 'setup'; renderExam(); break;
      case 'toggle-wrong': exam.onlyWrong = !exam.onlyWrong; renderExam(); break;
    }
  });
  examEl.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('input[name="opt"]')) return onSelect(t);
    if (t.id === 'e-mode') { exam.cfg.mode = t.value; store.set('examMode', t.value); renderSetup(); }
    else if (t.id === 'e-domain') {
      exam.cfg.domain = t.value; exam.cfg.topic = 'all';
      store.set('examDomain', t.value); store.set('examTopic', 'all'); renderSetup();
    }
    else if (t.id === 'e-topic') { exam.cfg.topic = t.value; store.set('examTopic', t.value); }
    else if (t.id === 'e-count') { exam.cfg.count = t.value; store.set('examCount', t.value); }
    else if (t.id === 'e-timed') { exam.cfg.timed = t.checked; store.set('examTimed', t.checked); }
  });

  /* ------------------------------------------------------------------ */
  buildDeck(false);
  renderFlash();
  renderExam();
})();

</script>
</body>
</html>
